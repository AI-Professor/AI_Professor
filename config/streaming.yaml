sequenceDiagram
    participant User
    participant Frontend
    participant Backend
    participant D-ID
    
    User->>Frontend: Ask question (voice)
    Frontend->>Frontend: STT Conversion
    Frontend->>Backend: Send text question
    Backend->>Backend: Process with GPT-4
    Backend->>Frontend: Return answer text
    Frontend->>D-ID: Generate TTS + Avatar Stream
    D-ID-->>Frontend: WebRTC Stream
    Frontend->>User: Display talking avatar