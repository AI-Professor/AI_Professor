<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up - AI Lecturer</title>
  <link rel="stylesheet" href="/public/styles/signup.css"/>
</head>
<body>
  <!-- ---------- Navigation ---------- -->
  <div id="navbar-container"></div>

  <!-- ---------- Sign Up Form ---------- -->
  
  <div class="container">
    <h2>Create Your Account</h2>
    <!-- Changed form action to /signup -->
    <form>
      <label for="firstname">First Name</label>
      <input type="text" id="firstname" name="firstname" placeholder="Enter your first name" required>

      <label for="lastname">Last Name</label>
      <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required>

      <label for="username">User Name</label>
      <input type="text" id="username" name="username" placeholder="Enter your user name" required>

      <label for="university">University</label>
      <input type="text" id="university" name="university" placeholder="Enter your university" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter a secure password" required>

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
      
      <!-- Captcha Section -->
      <label for="captcha-container">Captcha</label>
      <div id="captcha-container">
          <img id="captcha-image" src="" alt="Captcha Image">
          <input type="text" id="captcha-input" name="captcha_text" placeholder="Enter captcha" required>
          <input type="hidden" id="captcha-id" name="captcha_id">
      </div>
      
      <button type="button" id="register-button">Sign Up</button>
    </form>
    <div class="redirect">
      <p>Already have an account? <a href="/login.html">Sign In</a></p>
    </div>
    <div id="register-message"></div>
  </div>

  <script type="module" src="/public/scripts/signup.js"></script>

</body>
</html>
