<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Account - AI Lecturer</title>
  <link rel="stylesheet" href="/public/styles/my-account.css"/>
</head>
<body>
  <!-- ---------- Navigation ---------- -->
  <div id="navbar-container"></div>
  <!-- 🔹 Account Section -->
  <div class="account-container">
    <h2 class="page-title">My Account</h2>

    <div class="account-header">
      <div class="profile">
        <!-- <img class="profile-img" src="https://via.placeholder.com/150" alt="User Avatar"> -->
        <div class="user-info">
          <h3 id="username">Loading...</h3>
          <p id="user-email">Loading...</p>
        </div>
      </div>
      <button id="edit-btn" class="edit-btn">Edit</button>
    </div>

    <!-- Read-Only Info Grid -->
    <div class="info-grid">
      <div>
        <h4>User ID</h4>
        <div class="info-box" id="userIdText">Loading...</div>
        <input type="text" id="userIdInput" class="hidden" value="">
      </div>

      <div>
        <h4>Major</h4>
        <div class="info-box" id="majorText">Loading...</div>
        <input type="text" id="majorInput" class="hidden" value="">
      </div>

      <div>
        <h4>Email</h4>
        <div class="info-box" id="emailText">Loading...</div>
        <input type="email" id="emailInput" class="hidden" value="">
      </div>

      <div>
        <h4>Subscription Plan</h4>
        <div class="info-box" id="subscriptionText">Loading...</div>
        <input type="text" id="subscriptionInput" class="hidden" value="">
      </div>

      <div>
        <h4>Role</h4>
        <div class="info-box" id="roleText">Loading...</div>
        <input type="text" id="roleInput" class="hidden" value="">
      </div>

      <div>
        <h4>University</h4>
        <div class="info-box" id="universityText">Loading...</div>
        <input type="text" id="universityInput" class="hidden" value="">
      </div>
    </div>

    <button id="save-btn" class="save-btn" onclick="saveChanges()">Save Changes</button>
  </div>

  <!-- 🔹 Footer -->
  <footer>
    <p>&copy; 2025 AI Lecturer. All rights reserved.</p>
  </footer>

  <script type="module" src="/public/scripts/my-account.js"></script>

</body>
</html>
