<!--This is our main frontend HTML file-->


<!DOCTYPE html>
<html>
  <head>
    <title>D-ID Streaming POC</title>
    <!-- added google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/public/styles/style-agents.css"/>
  </head>

  <body>
  <script type="module" src="/public/scripts/agents-client-api.js"></script>
    <!-- added "id=content" -->
    <div id="content">
      <!-- added "id=video-wrapper" -->
      <div id="video-wrapper">
        <div>
          <video id="idle-video-element" width="400" height="400" autoplay style="opacity: 1"></video>
          <video id="stream-video-element" width="400" height="400" autoplay style="opacity: 0"></video>
        </div>
      </div>
      <br />

      <!-- added div#buttons -->
      <div id="buttons">
        <button id="connect-button" type="button">Connect</button>
        <button id="destroy-button" type="button">Destroy</button>
      </div>
      <div id="quiz-section">
        <h2>Lecture Quiz</h2>
        <button id="start-quiz-btn">Start Quiz</button>
        <button id="clear-quiz-btn" class="danger">Clear Quiz Database</button>
        <div id="quiz-container"></div>
      </div>
      <div class="status-box">
        <h3>Voice Interaction</h3>
        <button id="start-button">Start Speaking</button>
        <div id="msgHistory" style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px;"></div>
      </div>
      <div class="file-upload-section">
        <h3>Upload Course Materials</h3>
        <input type="file" id="fileInput" accept=".pdf,.epub,.mp4,.mov,.avi" multiple/>
        <button id="upload-button">Upload & Process</button>
        <div id="uploadStatus"></div>
      </div>

      <!-- added div#status -->
      <div id="status">
        <!-- removed the wrapping <div> tags -->
        ICE gathering status: <label id="ice-gathering-status-label"></label><br />
        ICE status: <label id="ice-status-label"></label><br />
        Peer connection status: <label id="peer-status-label"></label><br />
        Signaling status: <label id="signaling-status-label"></label><br />
        Last stream event: <label id="stream-event-label"></label><br />
        Streaming status: <label id="streaming-status-label"></label><br />
      </div>

      <!-- added div#auth-section -->
      <div id="auth-section">
        <h2>Authentication</h2>
      <div id="register-section">
        <h3>Register</h3>
        <form id="register-form">
          <div class="form-group">
            <label for="register-email">Email:</label>
            <input type="email" id="register-email" required>
          </div>
          <div class="form-group">
            <label for="register-password">Password:</label>
            <input type="password" id="register-password" required>
          </div>
          <div class="form-group">
            <label>Verification code:</label>
            <div class="captcha-box">
              <input type="text" id="register-captcha" required>
              <img id="register-captcha-img" class="captcha-img"
                   onclick="refreshCaptcha('register')">
            </div>
          </div>
          <button type="submit">Register</button>
        </form>
        <div id="register-message"></div>
      </div>

        <div id="login-section">
        <h3>Login</h3>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required>
          </div>
          <div class="form-group">
            <label>Verification code:</label>
            <div class="captcha-box">
              <input type="text" id="login-captcha" required>
              <img id="login-captcha-img" class="captcha-img"
                   onclick="refreshCaptcha('login')">
            </div>
          </div>
          <button type="submit">Login</button>
        </form>
        <div id="login-message"></div>
      </div>
    </div>
  </div>



 <script>

async function loadCaptcha(type) {
    try {
        const response = await fetch(`http://localhost:5001/api/captcha?type=${type}`);
        const data = await response.json();
        document.getElementById(`${type}-captcha-img`).src = data.image;
        window.captchaData[type].id = data.captcha_id;
    } catch (error) {
        console.error('error:', error);
    }
}

function refreshCaptcha(type) {
    loadCaptcha(type);
    document.getElementById(`${type}-captcha`).value = '';
}


document.addEventListener('DOMContentLoaded', () => {
    ['register', 'login'].forEach(type => {
        loadCaptcha(type);
    });
});
</script>



</body>
</html>
