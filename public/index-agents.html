<!--This is our main frontend HTML file-->
<!DOCTYPE html>
<html>
  <head>
    <title>AI Professor</title>
    <!-- added google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/public/styles/style-agents.css"/>
  </head>

  <body>
    <!-- adde "id=content" -->
    <div id="content">
      <!-- added "id=video-wrapper" -->
      <div id="video-wrapper">
        <div>
          <video id="pixelStreamVideo" width="700" height="500" autoplay muted playsinline style="opacity: 1"></video>
        </div>
      </div>
      <div id="audio-controls" style="margin-top: 10px;">
        <label>
          <input type="checkbox" id="audio-sync-toggle" checked>
          Enable Audio Sync
        </label>
      </div>
      <br />

      <!-- added div#buttons -->
      <div id="buttons">
        <button id="connect-button" type="button">Connect</button>
        <button id="disconnect-button" type="button" class="danger">Disconnect</button>
      </div>
      <div id="lecture-section">
        <h2>Lecture</h2>
        <input type="text" id="topic-input" placeholder="Enter a topic you'd like to learn about">
        <button id="lecture-button" type="button">Learn a short lesson</button>
      </div>
      <div id="quiz-section">
        <h2>Lecture Quiz</h2>
        <button id="start-quiz-btn">Start Quiz</button>
        <div id="quiz-container"></div>
      </div>
      <div class="status-box">
        <h3>Voice Interaction</h3>
        <button id="start-button">Start Speaking</button>
        <div id="msgHistory" style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px;"></div>
      </div>
      <div class="file-upload-section">
        <h3>Upload Course Materials</h3>
        <input type="file" id="fileInput" accept=".pdf,.epub,.mp4,.mov,.avi" multiple/>
        <button id="upload-button">Upload & Process</button>
        <div id="uploadStatus"></div>
      </div>

      <script src="/public/scripts/player.js"></script>
      <script type="module" src="/public/scripts/agents-client-api.js"></script>
      
  </body>
</html>
