<!--This is our main frontend HTML file-->
<!DOCTYPE html>
<html>
  <head>
    <title>Virtual Lecturer</title>
    <!-- added google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/public/styles/style-agents.css"/>
    <!-- added favicon link -->
    <link rel="icon" href="/public/assets/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <!-- added "id=content" -->
    <div id="content">
      <!-- added "id=video-wrapper" -->
      <div id="video-wrapper">
        <div>
          <video id="idle-video-element" width="400" height="400" autoplay style="opacity: 1"></video>
          <video id="stream-video-element" width="400" height="400" autoplay style="opacity: 0"></video>
        </div>
      </div>
      <br />

      <!-- added div#buttons -->
      <div id="buttons">
        <button id="connect-button" type="button">Connect</button>
        <button id="destroy-button" type="button">Destroy</button>
      </div>
      <div id="quiz-section">
        <h2>Lecture Quiz</h2>
        <button id="start-quiz-btn">Start Quiz</button>
        <button id="clear-quiz-btn" class="danger">Clear Quiz Database</button>
        <div id="quiz-container"></div>
      </div>
      <div class="status-box">
        <h3>Voice Interaction</h3>
        <button id="start-button">Start Speaking</button>
        <div id="msgHistory" style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px;"></div>
        <!-- replaced input with textarea -->
        <textarea id="text-input" placeholder="Type your question here"></textarea>
        <button id="text-submit-button">Submit</button>
      </div>
      <div class="file-upload-section">
        <h3>Upload Course Materials</h3>
        <input type="file" id="fileInput" accept=".pdf,.epub,.mp4,.mov,.avi" multiple/>
        <button id="upload-button">Upload & Process</button>
        <div id="uploadStatus"></div>
      </div>

      <!-- added div#status -->
      <div id="status">
        <!-- removed the wrapping <div> tags -->
        ICE gathering status: <label id="ice-gathering-status-label"></label><br />
        ICE status: <label id="ice-status-label"></label><br />
        Peer connection status: <label id="peer-status-label"></label><br />
        Signaling status: <label id="signaling-status-label"></label><br />
        Last stream event: <label id="stream-event-label"></label><br />
        Streaming status: <label id="streaming-status-label"></label><br />
      </div>

      <!-- added div#auth-section -->
      <div id="auth-section">
        <h2>Authentication</h2>
        <div id="register-section">
          <h3>Register</h3>
          <form id="register-form">
            <label for="register-email">Email:</label>
            <input type="email" id="register-email" required>
            <label for="register-password">Password:</label>
            <input type="password" id="register-password" required>
            <button type="button" id="register-button">Register</button>
          </form>
          <div id="register-message"></div>
        </div>
        <div id="login-section">
          <h3>Login</h3>
          <form id="login-form">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required>
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required>
            <button type="submit">Login</button>
          </form>
          <div id="login-message"></div>
        </div>
      </div>
      <button id="fetch-user-info">Fetch User Info</button>
      <div id="user-info"></div>
    </div>

    <script type="module" src="/public/scripts/agents-client-api.js" defer></script>
  </body>
</html>
