<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AI Lecturer</title>
  <link rel="stylesheet" href="/public/styles/login.css"/>
</head>
<body>
  <!-- ---------- Navigation ---------- -->
  <div id="navbar-container"></div>

  <!-- ---------- Login Form ---------- -->
  <div class="container">
    <h2>Login to AI Lecturer</h2>
    <form id="login-form">
      <label for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
      
      <!-- Captcha Section -->
      <label for="captcha-container">Captcha</label>
      <div id="captcha-container">
          <img id="captcha-image" src="" alt="Captcha Image">
          <input type="text" id="captcha-input" name="captcha_text" placeholder="Enter captcha" required>
          <input type="hidden" id="captcha-id" name="captcha_id">
      </div>

      <button type="button" id="login-button">Login</button>
    </form>
    <div class="redirect">
      <p>Don’t have an account? <a href="/public/signup.html">Sign Up</a></p>
    </div>
    <div id="login-message"></div>
  </div>

  <script type="module" src="/public/scripts/login.js"></script>
</body>
</html>
